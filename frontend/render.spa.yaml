# Optional Render Blueprint fragment for the HCM frontend static site.
# Apply in Render (or merge into your existing blueprint) so /portal and other
# client routes serve HTML instead of an empty 200.
services:
  - type: web
    name: asil-hcm-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /portal
        destination: /portal.html
      - type: rewrite
        source: /cmms
        destination: /cmms.html
      - type: rewrite
        source: /claims-fill
        destination: /claims-fill.html
      - type: rewrite
        source: /claims-approve
        destination: /claims-approve.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /portal
        name: Content-Type
        value: text/html; charset=utf-8
