# Optional Render Blueprint fragment for the HCM frontend static site.
# Apply in Render (or merge into your existing blueprint) so /portal and other
# client routes serve index.html instead of an empty 200.
services:
  - type: web
    name: asil-hcm-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
