<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Engine Verification</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        .container { background: #fff; padding: 20px; border-radius: 8px; max-width: 600px; margin: auto; }
        .group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; }
        pre { background: #e9ecef; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Tax Engine Verification Module</h2>
        <div class="group">
            <label for="gross">Gross Salary (PKR)</label>
            <input type="number" id="gross" value="150000" />
        </div>
        <div class="group">
            <label for="join">Joining Date</label>
            <input type="date" id="join" value="2020-01-01" />
        </div>
        <button onclick="calculateTaxes()" id="calcBtn">Run Calculation</button>

        <h3>Results</h3>
        <pre id="output">Run calculation to see results...</pre>
    </div>
    
    <script>
        async function calculateTaxes() {
            const gross = document.getElementById('gross').value;
            const join = document.getElementById('join').value;
            
            const response = await fetch('/api/calculate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ grossSalary: gross, joiningDate: join })
            });

            const data = await response.json();
            document.getElementById('output').textContent = JSON.stringify(data.results, null, 2);
        }
    </script>
</body>
</html>
